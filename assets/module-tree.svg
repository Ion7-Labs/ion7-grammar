<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .pkg      { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; rx: 8; ry: 8; }
    .grp      { fill: #faf5ff; stroke: #a78bfa; stroke-width: 1.2; rx: 6; ry: 6; }
    .leaf     { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1; rx: 5; ry: 5; }
    .ext      { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; rx: 6; ry: 6; }
    .label    { fill: #1f2937; font-weight: 600; }
    .name     { fill: #1f2937; }
    .sub      { fill: #4b5563; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .pkg     { fill: #2e1065; stroke: #a78bfa; }
      .grp     { fill: #3b0764; stroke: #c4b5fd; }
      .leaf    { fill: #1e1b4b; stroke: #c4b5fd; }
      .ext     { fill: #14532d; stroke: #4ade80; }
      .label   { fill: #e5e7eb; }
      .name    { fill: #e5e7eb; }
      .sub     { fill: #9ca3af; }
    }
  </style>

  <!-- Top-level package -->
  <rect class="pkg" x="270" y="20" width="220" height="48"/>
  <text class="label" x="380" y="42" text-anchor="middle">ion7.grammar</text>
  <text class="sub"   x="380" y="60" text-anchor="middle">init.lua  ·  Grammar_obj  ·  raw</text>

  <!-- ast group -->
  <rect class="grp" x="20" y="100" width="220" height="160"/>
  <text class="label" x="130" y="124" text-anchor="middle">ast</text>
  <rect class="leaf" x="36" y="138" width="190" height="22"/>
  <text class="name" x="46" y="153">nodes.lua  · 7 node kinds</text>
  <rect class="leaf" x="36" y="166" width="190" height="22"/>
  <text class="name" x="46" y="181">builder.lua  · O(1) replace</text>
  <rect class="leaf" x="36" y="194" width="190" height="22"/>
  <text class="name" x="46" y="209">compiler.lua  · AST → GBNF</text>
  <rect class="leaf" x="36" y="222" width="190" height="22"/>
  <text class="name" x="46" y="237">walk.lua  · refs + literals</text>

  <!-- from group -->
  <rect class="grp" x="270" y="100" width="220" height="216"/>
  <text class="label" x="380" y="124" text-anchor="middle">from</text>
  <rect class="leaf" x="286" y="138" width="190" height="22"/>
  <text class="name" x="296" y="153">regex.lua  · ERE / PCRE</text>
  <rect class="leaf" x="286" y="166" width="190" height="22"/>
  <text class="name" x="296" y="181">abnf.lua  · RFC 5234</text>
  <rect class="leaf" x="286" y="194" width="190" height="22"/>
  <text class="name" x="296" y="209">ebnf.lua  · W3C-style</text>
  <rect class="leaf" x="286" y="222" width="190" height="22"/>
  <text class="name" x="296" y="237">json/  · Schema, converter</text>
  <rect class="leaf" x="286" y="250" width="190" height="22"/>
  <text class="name" x="296" y="265">types.lua  · type DSL</text>
  <rect class="leaf" x="286" y="278" width="190" height="22"/>
  <text class="name" x="296" y="293">dynamic.lua  · enum / tools</text>

  <!-- runtime group -->
  <rect class="grp" x="520" y="100" width="220" height="132"/>
  <text class="label" x="630" y="124" text-anchor="middle">runtime  · per-seq isolated</text>
  <rect class="leaf" x="536" y="138" width="190" height="22"/>
  <text class="name" x="546" y="153">context.lua  · GrammarContext</text>
  <rect class="leaf" x="536" y="166" width="190" height="22"/>
  <text class="name" x="546" y="181">backtrack.lua  · CRANE rollback</text>
  <rect class="leaf" x="536" y="194" width="190" height="22"/>
  <text class="name" x="546" y="209">dccd.lua  · arXiv:2603.03305</text>

  <!-- compose / except -->
  <rect class="grp" x="20" y="290" width="220" height="76"/>
  <text class="label" x="130" y="314" text-anchor="middle">composition</text>
  <rect class="leaf" x="36" y="324" width="190" height="22"/>
  <text class="name" x="46" y="339">compose.lua  · union, seq, …</text>
  <rect class="leaf" x="36" y="352" width="60"  height="0"/>

  <rect class="grp" x="20" y="390" width="220" height="76"/>
  <text class="label" x="130" y="414" text-anchor="middle">complement</text>
  <rect class="leaf" x="36" y="424" width="190" height="22"/>
  <text class="name" x="46" y="439">except.lua  · char / value / pattern</text>

  <!-- dev group -->
  <rect class="grp" x="270" y="350" width="220" height="104"/>
  <text class="label" x="380" y="374" text-anchor="middle">dev</text>
  <rect class="leaf" x="286" y="384" width="190" height="22"/>
  <text class="name" x="296" y="399">debug.lua  · inspect, tree, diff</text>
  <rect class="leaf" x="286" y="412" width="190" height="22"/>
  <text class="name" x="296" y="427">fuzz.lua  · pure-Lua xorshift</text>

  <!-- external deps -->
  <rect class="ext" x="520" y="290" width="220" height="100"/>
  <text class="label" x="630" y="312" text-anchor="middle">external dependencies</text>
  <rect class="leaf" x="536" y="322" width="190" height="22"/>
  <text class="name" x="546" y="337">lpeg ≥ 1.0  · parser substrate</text>
  <rect class="leaf" x="536" y="350" width="190" height="22"/>
  <text class="name" x="546" y="365">lua-cjson (via ion7-core)</text>

  <rect class="ext" x="520" y="410" width="220" height="50"/>
  <text class="label" x="630" y="432" text-anchor="middle">ion7.core  · for Backtrack/DCCD</text>
  <text class="sub"   x="630" y="450" text-anchor="middle">Sampler · Context · Vocab · bridge</text>

  <!-- tests + examples row -->
  <rect class="leaf" x="20" y="490" width="350" height="34"/>
  <text class="label" x="195" y="513" text-anchor="middle">tests/  · 11 numbered suites · 403 tests</text>
  <rect class="leaf" x="390" y="490" width="350" height="34"/>
  <text class="label" x="565" y="513" text-anchor="middle">examples/  · 10 progressive scripts</text>
</svg>
